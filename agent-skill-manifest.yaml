  operator:
    kind: pipeline_owner
    model: sonnet
    description: Pipeline owner for system care — deploys, plugin audits, skill consolidation, syncs, handoffs, and retros
    owns_slash_commands: [/deploy, /update-plugins, /consolidate-skills, /sync-notion, /handoff, /system-retro]
