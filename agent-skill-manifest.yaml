# Source of truth for agent + skill + JTBD wiring.
# DO NOT EDIT generated views (~/.claude/agents/*.md, ~/.claude/docs/skill-directory.md).
# Run: python3 ~/.claude/scripts/render-manifest.py
# Validate: bash ~/.claude/scripts/validate-manifest.sh

version: 1
last_updated: 2026-05-24

roles:
  - id: builder
    description: Code, infra, scripts, hooks, tools
    pipeline_owner: builder
  - id: creator
    description: All content production (short-form + longform + business)
    pipeline_owner: creator
  - id: strategist
    description: Marketing strategy + decision pipeline + diagnostic work
    pipeline_owner: strategist
  - id: researcher
    description: Tech + market research + fact verification
    pipeline_owner: researcher
  - id: operator
    description: System care — deploys, plugins, retros, tracking, summaries
    pipeline_owner: operator

jtbd:
  - id: ship-a-feature
    role: builder
    description: Ship a major feature end-to-end with spec, tests, review, and deploy
    owner: builder
    specialists: [product-lead, designer, debugger, reviewer, security, memory-keeper]
    slash_command: /ship
    default_scope: M
    skills:
      - superpowers:writing-plans
      - superpowers:test-driven-development
      - superpowers:subagent-driven-development
      - superpowers:verification-before-completion
      - superpowers:requesting-code-review
      - superpowers:finishing-a-development-branch

  - id: fix-a-bug
    role: builder
    description: Fix a bug quickly — no spec, minimal ceremony
    owner: builder
    specialists: [reviewer]
    slash_command: /fix
    default_scope: S
    skills:
      - superpowers:systematic-debugging
      - superpowers:verification-before-completion

  - id: plan-feature
    role: builder
    description: Plan a feature before building — spec, risks, task breakdown
    owner: builder
    specialists: [product-lead]
    slash_command: /plan
    default_scope: M
    skills:
      - superpowers:brainstorming
      - superpowers:writing-plans
      - compound-engineering:workflows:plan

  - id: add-config-flag
    role: builder
    description: Add or modify a configuration flag, env var, or setting
    owner: builder
    specialists: [reviewer]
    slash_command: /fix
    default_scope: S
    skills:
      - update-config
      - superpowers:verification-before-completion

  - id: refactor-a-module
    role: builder
    description: Refactor an existing module without changing behavior
    owner: builder
    specialists: [reviewer]
    slash_command: /build
    default_scope: M
    skills:
      - superpowers:test-driven-development
      - superpowers:verification-before-completion
      - simplify

  - id: add-jtbd-to-manifest
    role: builder
    description: Extend the agent-skill manifest with a new JTBD definition
    owner: builder
    specialists: [product-lead, memory-keeper, reviewer]
    slash_command: /ship
    default_scope: M
    skills:
      - superpowers:writing-plans
      - superpowers:test-driven-development
      - superpowers:subagent-driven-development
      - superpowers:verification-before-completion

  - id: add-pipeline-owner
    role: builder
