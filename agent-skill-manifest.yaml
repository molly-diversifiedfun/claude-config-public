agents:
  builder:
    kind: pipeline_owner
    model: sonnet
    description: Pipeline owner for code, infra, scripts, hooks, and tools — owns /plan /build /ship /fix
    owns_slash_commands: [/plan, /build, /ship, /fix]
    owns_jtbd:
      - ship-a-feature
      - fix-a-bug
      - plan-feature
      - add-config-flag
      - refactor-a-module
      - add-jtbd-to-manifest
      - add-pipeline-owner
      - review-pr
      - security-audit
    skills:
      primary:
        - superpowers:test-driven-development
        - superpowers:subagent-driven-development
        - superpowers:verification-before-completion
        - superpowers:writing-plans
        - superpowers:brainstorming
        - superpowers:systematic-debugging
      chain:
        - superpowers:requesting-code-review
        - superpowers:finishing-a-development-branch
        - superpowers:using-git-worktrees
        - compound-engineering:workflows:plan
        - compound-engineering:workflows:work
        - compound-engineering:workflows:review
        - simplify
        - update-config
    tools:
      built_in:
        - Read
        - Write
        - Edit
        - Bash
        - Glob
        - Grep
        - TodoWrite
        - AskUserQuestion
        - Task
        - WebSearch
        - WebFetch
      mcp:
        - compound-engineering:context7
        - mempalace
        - supabase
        - firecrawl
    can_invoke_specialists:
      - product-lead
      - designer
      - debugger
      - reviewer
      - security
      - memory-keeper
    notes: |
      Primary engineering pipeline owner. Owns the /ship pipeline including Stage 1
      (memory pre-flight via memory-keeper) and Stage 11 (capture via memory-keeper).
      Delegates plan-writing to product-lead on L/XL scopes, UI work to designer,
      nasty bugs to debugger, all pre-merge review to reviewer, and auth/migration
      review to security. Must include AskUserQuestion to clarify scope at intake
      rather than guessing.

  creator:
    kind: pipeline_owner
    model: sonnet
    description: Pipeline owner for all content production — short-form social, longform, and business deliverables
    owns_slash_commands: [/write]
    owns_jtbd:
      - make-instagram-carousel
      - write-blog-post
      - write-youtube-script
      - write-conversion-copy
      - write-resume
      - write-flamingo-chapter
      - atomize-content
    skills:
      primary:
        - brand-voice-router
        - content-atomizer
        - conversion-copywriting
        - humanize-ai-writing
      chain:
        - hooks
        - carousel-writer
        - content-strategy
        - content-calendar
        - youtube-scriptwriting
        - flamingo-doc-style
        - resume-rebuilder
        - voice-extractor
        - canva-carousel
        - seo-audit
        - marketing-psychology
    tools:
      built_in:
        - Read
        - Write
        - Edit
        - Bash
        - Glob
        - Grep
        - TodoWrite
        - AskUserQuestion
        - Task
        - WebSearch
        - WebFetch
      mcp:
        - canva
        - mempalace
        - firecrawl
    can_invoke_specialists:
      - content-qa
      - designer
    notes: |
      Owns the full /write pipeline. Always routes brand voice via brand-voice-router
      first, then humanize-ai-writing as the last step before content-qa. canva MCP
      is required for carousel template injection per gap-fix.

  strategist:
    kind: pipeline_owner
    model: sonnet
    description: Pipeline owner for marketing strategy, decision-making, diagnostics, and stuck-project unsticking
    owns_slash_commands: []
    owns_jtbd:
      - make-decision
      - stress-test-idea
      - plan-content-strategy
      - audit-followability
      - diagnose-stuck-project
    skills:
      primary:
        - content-strategy
        - content-calendar
        - marketing-psychology
        - decision-maker
        - devils-advocate
        - mental-models
        - seo-audit
        - keyword-research
        - brainstorm
        - ai-build-partner
        - followability-audit
      chain:
        - self-interview
        - ask-me-the-questions
        - unstuck
        - content-gap-analysis
        - competitor-analysis
    tools:
      built_in:
        - Read
        - Write
        - Edit
        - Bash
        - Glob
        - Grep
        - TodoWrite
        - AskUserQuestion
        - Task
        - WebSearch
        - WebFetch
      mcp:
        - mempalace
        - firecrawl
        - compound-engineering:context7
    can_invoke_specialists: []
    notes: |
      No utility specialists — strategist runs its skill chains in-process.
      AskUserQuestion is critical for the decision-maker, followability-audit, and
      ai-build-partner flows which require structured user input to proceed.

  researcher:
    kind: pipeline_owner
    model: sonnet
    description: Pipeline owner for tech research, market research, and fact verification
    owns_slash_commands: [/research]
    owns_jtbd:
      - research-library
      - research-market
    skills:
      primary:
        - firecrawl
        - compound-engineering:context7
      chain:
