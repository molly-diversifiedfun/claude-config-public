# ~/.claude/skill-archetypes.yaml — skill name → archetype tags (manual, opinionated)
#
# Phase 7.1 — seeded 2026-05-20 from real-usage data (45 invocations / 20 unique skills
# mined from 30 transcripts) PLUS "Bucket B" archetype-relevant skills the user currently
# forgets to invoke (carl-manager, ui-ux-pro-max, copywriting, mental-models, etc.).
#
# Vocabulary (same as projects.yaml):
#   web-app | telegram-bot | content-pipeline | python-cli |
#   video-pipeline | infra-config | brand-content | always-on
#
# Resolution: a skill fires for the active archetype if its archetype list contains
# the archetype OR "always-on". Capped at 10 per archetype block at render time.
#
# Format: "<skill-name>": [archetype1, archetype2, ...]
# - Personal skills: bare name (e.g. "brand-voice-router")
# - Plugin skills:   full prefixed name (e.g. "superpowers:brainstorming")
#
# To re-bootstrap from installed skills:
#   python3 ~/.claude/scripts/bootstrap-skill-archetypes.py > /tmp/draft.yaml 2>/tmp/unmapped.txt
# To validate:
#   bash ~/.claude/scripts/validate-skill-archetypes.sh

# ============================================================
# === Personal skills (~/.claude/skills/) ===
# ============================================================

