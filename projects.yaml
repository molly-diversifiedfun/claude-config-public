# ~/.claude/projects.yaml — path → archetype mapping for archetype injection.
# Resolution order in archetype-injector.sh:
#   1. Exact match (after expanding ~)
#   2. Longest-prefix match (parent dir wins for sub-dirs)
#   3. Auto-detect (file-presence signals)
#   4. Fallback: "unknown" (always-on patterns only)
#
# Archetypes: web-app | telegram-bot | content-pipeline | python-cli | video-pipeline | infra-config | brand-content
# severity: blocking patterns always inject; this manifest gates the rest.
#
# ⚠️  REPLACE WITH YOUR OWN PROJECTS. Below are placeholder examples showing the format
# for each archetype — delete what you don't use, add your real paths.

# Web apps (Vite/React/Vercel/Supabase)
"~/github/<your-web-app-1>": web-app
"~/github/<your-web-app-2>": web-app

# Telegram bots (Node + n8n + Telegram API)
"~/github/<your-bot-1>": telegram-bot

# Content pipelines (n8n + Apify + Notion + ReportLab PDFs)
"~/github/<your-content-pipeline>": content-pipeline

# Python CLIs
"~/github/<your-python-cli>": python-cli

# Video pipelines
"~/github/<your-video-pipeline>": video-pipeline

# Infra / config
"~/github/claude-config": infra-config
"~/github/claude-config-public": infra-config

# Brand content (writing-only dirs + book projects)
"~/github/<your-brand-content>": brand-content
